name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report toolchain versions
        run: |
          ${{ matrix.cxx }} --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan

  lint:
    name: clang-tidy (misc-include-cleaner)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        run: >
          clang-tidy -p build
          --checks='-*,misc-include-cleaner'
          --warnings-as-errors='*'
          src/game/game.cpp src/tui/tui.cpp src/button/button.cpp src/main.cpp
          tests/game_test.cpp tests/tui_test.cpp

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: >
          clang-format --dry-run --Werror
          src/game/game.cpp src/game/game.hpp src/game/random_layout.hpp
          src/tui/tui.cpp src/tui/tui.hpp
          src/button/button.cpp src/button/button.hpp
          src/enums/field_type.hpp src/enums/game_state.hpp
          src/structs/board_coord.hpp src/helpers.hpp src/main.cpp
          tests/game_test.cpp tests/tui_test.cpp
